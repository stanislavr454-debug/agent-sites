<!DOCTYPE html><html><head><title>Змейка</title><style>canvas {border: 1px solid #000; display: block; margin: 0 auto; background: #f0f0f0;}</style></head><body><canvas id="game" width="400" height="400"></canvas><script>const canvas = document.getElementById('game');const ctx = canvas.getContext('2d');let snake = [{x: 200, y: 200}];let dx = 10, dy = 0;let food = {x: 300, y: 300};function game() {let head = {x: snake[0].x + dx, y: snake[0].y + dy};if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(segment => segment.x === head.x && segment.y === head.y)) {alert('Игра окончена!');return;}snake.unshift(head);if (head.x === food.x && head.y === food.y) {food = {x: Math.floor(Math.random() * (canvas.width/10))*10, y: Math.floor(Math.random() * (canvas.height/10))*10};} else {snake.pop();}ctx.clearRect(0, 0, canvas.width, canvas.height);ctx.fillStyle = 'lime';snake.forEach(segment => {ctx.fillRect(segment.x, segment.y, 10, 10);});ctx.fillStyle = 'red';ctx.fillRect(food.x, food.y, 10, 10);requestAnimationFrame(game);}document.addEventListener('keydown', e => {if (e.key === 'ArrowLeft') {dx = -10; dy = 0;} else if (e.key === 'ArrowRight') {dx = 10; dy = 0;} else if (e.key === 'ArrowUp') {dx = 0; dy = -10;} else if (e.key === 'ArrowDown') {dx = 0; dy = 10;}});game();</script></body></html>
